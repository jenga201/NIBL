# Trust the swag reverse proxy (my-bridge network) as the authoritative source
# of X-Forwarded-For. mod_remoteip then rewrites the client address so the
# access log (and REMOTE_ADDR) show the real requester rather than the proxy
# container's IP.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.21.0.0/16
