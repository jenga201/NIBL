# Trust the swag reverse proxy as the authoritative source of X-Forwarded-For.
# mod_remoteip then rewrites the client address so the access log (and
# REMOTE_ADDR) show the real requester rather than the proxy container's IP.
# 172.16.0.0/12 covers every Docker-assigned private bridge subnet (172.17.x,
# 172.18.x, 172.21.x, ...), so the same image works on any host.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12
