[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
startsecs=1
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --timeout=1800 --max-time=3600 --max-jobs=100
user=www-data
autostart=true
autorestart=true
startsecs=1
startretries=5
numprocs=__WORKERS__
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
