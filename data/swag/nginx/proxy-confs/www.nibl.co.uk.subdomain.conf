# make sure that your dns has a cname set for znc

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Block scraper IPs and crawler bots (MJ12bot, serpstatbot) that only
    # send junk /bots requests with duplicated sort params (logs-export
    # analysis, 2026-11-06 / 2026-11-09).
    deny 85.25.210.23;
    deny 85.25.185.20;
    deny 85.25.185.79;
    deny 188.138.9.93;

    if ($http_user_agent ~* "(MJ12bot|serpstatbot)") {
        return 444;
    }

    location / {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_niblcouk niblcouk;
        proxy_pass http://$upstream_niblcouk:80;
    }

    location /app {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_reverb reverb;
        proxy_pass http://$upstream_reverb:8080;
    }

    location /apps/ {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_reverb reverb;
        proxy_pass http://$upstream_reverb:8080;
    }

}
