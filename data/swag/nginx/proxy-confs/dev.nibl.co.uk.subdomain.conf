server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dev.nibl.co.uk;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_niblcouk niblcouk;
        proxy_pass http://$upstream_niblcouk:80;
    }

    location /app {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_reverb reverb;
        proxy_pass http://$upstream_reverb:8080;
    }

    location /apps/ {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;
        set $upstream_reverb reverb;
        proxy_pass http://$upstream_reverb:8080;
    }
}