name: nibl

services:
  niblmysql:
    image: mysql:8.4.13
    container_name: niblmysql
    user: "1000:1000"
    command: mysqld --socket=/tmp/mysql.sock --pid-file=/tmp/mysqld.pid --log-error=/logs/mysql-error.log --innodb-buffer-pool-size=1073741824 --innodb-buffer-pool-instances=8 --innodb-redo-log-capacity=1073741824
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ooinuza
    expose:
      - "3306"
      - "33060"
    ports:
      - "${NIBLMYSQL_BIND:-127.0.0.1}:${NIBLMYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./data/niblmysql:/var/lib/mysql
      - ./logs/niblmysql:/logs
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet

  niblirc:
    build:
      context: ./niblirc
      dockerfile: Dockerfile
    image: niblirc
    container_name: niblirc
    user: "1000:1000"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      niblmysql:
        condition: service_healthy
    environment:
      BOT_NAME: ${IRC_BOT_NAME:?Set IRC_BOT_NAME in .env}
      BOT_PASS: ${IRC_BOT_PASS:-}
      SERVER: ${IRC_SERVER:?Set IRC_SERVER in .env}
      PORT: ${IRC_PORT:?Set IRC_PORT in .env}
      DCC_PORTS: ${IRC_DCC_PORTS:?Set IRC_DCC_PORTS in .env}
      PUBLIC_IP: ${IRC_PUBLIC_IP:-}
      DB: ${IRC_DB:-mysql}
      DB_USER: ${SQL_USER:?Set SQL_USER in .env}
      DB_PASS: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      DB_SERVER: ${SQL_HOST:-niblmysql}
      DB_PORT: ${SQL_PORT:-3306}
      DB_NAME: ${SQL_DATABASE:-ooinuza}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      KEEP_PACKLIST_FILES: ${KEEP_PACKLIST_FILES:-false}
    ports:
      - "46571:46571"
      - "46572:46572"
      - "46573:46573"
    volumes:
      - ./niblirc/config:/config
      - ./data/niblirc:/data/botlists
      - ./logs/niblirc:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet

  niblcouk:
    build:
      context: ./nibl.co.uk
      dockerfile: Dockerfile
    image: niblcouk
    container_name: niblcouk
    init: true
    working_dir: /var/www/html
    command: ["/var/www/html/etc/docker/start-apache"]
    restart: unless-stopped
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - NET_BROADCAST
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/www/html/bootstrap/cache
    depends_on:
      niblmysql:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_KEY: ${WEB_APP_KEY:?Set WEB_APP_KEY in .env}
      APP_URL: ${WEB_APP_URL:-https://www.nibl.co.uk}
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: ${SQL_HOST:-niblmysql}
      DB_PORT: ${SQL_PORT:-3306}
      DB_DATABASE: ${SQL_DATABASE:-ooinuza}
      DB_USERNAME: ${SQL_USER:?Set SQL_USER in .env}
      DB_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      SESSION_DRIVER: file
      SESSION_LIFETIME: "60"
      SESSION_COOKIE: nibl-web
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_DAILY_DAYS: ${WEB_LOG_DAILY_DAYS:-14}
      LOG_LEVEL: ${WEB_LOG_LEVEL:-info}
      NIBL_DATA_CACHE: ${WEB_DATA_CACHE:-apcu}
      MEILI_ENABLED: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    expose:
      - "80"
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./data/nibl.co.uk:/var/www/html/var
      - ./logs/nibl.co.uk:/var/www/html/var/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet
      - my-bridge

  swag:
    image: lscr.io/linuxserver/swag:5.9.0-ls496
    container_name: swag
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - niblcouk
    environment:
      PUID: ${SWAG_PUID:-1000}
      PGID: ${SWAG_PGID:-1000}
      TZ: ${SWAG_TZ:-America/New_York}
      URL: ${SWAG_URL:-nibl.co.uk}
      SUBDOMAINS: ${SWAG_SUBDOMAINS:-www}
      VALIDATION: ${SWAG_VALIDATION:-http}
      EMAIL: ${SWAG_EMAIL:-}
      STAGING: ${SWAG_STAGING:-false}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./data/swag:/config
      - ./logs/swag:/config/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - my-bridge

  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    container_name: niblmeili
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-8}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet

  niblscheduler:
    image: niblcouk
    container_name: niblscheduler
    init: true
    command: ["/var/www/html/etc/docker/start-scheduler"]
    restart: unless-stopped
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - NET_BROADCAST
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/www/html/bootstrap/cache
    depends_on:
      niblcouk:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/supervisord.pid"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_KEY: ${WEB_APP_KEY:?Set WEB_APP_KEY in .env}
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: ${SQL_HOST:-niblmysql}
      DB_PORT: ${SQL_PORT:-3306}
      DB_DATABASE: ${SQL_DATABASE:-ooinuza}
      DB_USERNAME: ${SQL_USER:?Set SQL_USER in .env}
      DB_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-3600}
      LOG_CHANNEL: stderr
      LOG_DAILY_DAYS: ${WEB_LOG_DAILY_DAYS:-14}
      LOG_LEVEL: ${WEB_LOG_LEVEL:-info}
      MEILI_ENABLED: "true"
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_WORKERS: ${MEILI_WORKERS:-4}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in .env}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
      REVERB_HOST: ${REVERB_HOST:-www.nibl.co.uk}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./data/nibl.scheduler:/var/www/html/var
      - ./logs/nibl.scheduler:/var/www/html/var/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: niblredis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  reverb:
    image: niblcouk
    container_name: niblreverb
    init: true
    command: ["php", "artisan", "reverb:start"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_KEY: ${WEB_APP_KEY:?Set WEB_APP_KEY in .env}
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in .env}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
      REVERB_HOST: ${REVERB_HOST:-www.nibl.co.uk}
      REVERB_PORT: ${REVERB_PORT:-443}
      REVERB_SCHEME: ${REVERB_SCHEME:-https}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8080"
    networks:
      - appnet
      - my-bridge

networks:
  my-bridge:
    external: true
  appnet:
    driver: bridge